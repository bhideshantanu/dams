# Downloads the latest National Inventory of Dams once a month, rebuilds the data files,
# and saves them if anything changed. GitHub Pages then serves the updated page.
name: Refresh dam data

on:
  schedule:
    - cron: "17 14 3 * *" # 14:17 UTC on the 3rd of every month
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write # lets the workflow commit the new data files

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the repository files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download the National Inventory of Dams
        run: curl -fsSL --retry 3 --retry-delay 30 -o nation.csv "https://nid.sec.usace.army.mil/api/nation/csv"

      - name: Check the download looks complete
        run: |
          head -c 300 nation.csv; echo
          lines=$(wc -l < nation.csv)
          echo "Lines downloaded: $lines"
          if [ "$lines" -lt 80000 ]; then
            echo "The download looks incomplete, so the existing data is kept."
            exit 1
          fi

      - name: Rebuild the data files
        run: python scripts/build_dams.py nation.csv

      - name: Save the new data (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes in the inventory this month."
          else
            git commit -m "Refresh dam data $(date -u +%Y-%m-%d)"
            git push
          fi
